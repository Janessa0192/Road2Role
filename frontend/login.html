<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in - Road2Role</title>
  <link rel="stylesheet" href="/css/signin.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <script src="/js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="r2r-header" data-site-header></header>

  <main id="main" class="container">
    <form class="form-card" data-form novalidate>
      <h1>Sign in</h1>
      <p class="alert alert-info" data-info hidden>Brute-force protected: 5 attempts per 15 minutes.</p>
      <div class="alert alert-error" data-form-error hidden role="alert"></div>

      <div class="field">
        <label for="identifier">Email or username</label>
        <input id="identifier" name="identifier" type="text" autocomplete="username"
               placeholder="you@example.com" required autofocus />
        <p class="field-error" data-error-for="identifier"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <p class="field-error" data-error-for="password"></p>
      </div>

      <button class="btn btn-primary btn-block" type="submit" data-submit>Sign in</button>

      <p class="form-footer">
        New here? <a href="/register.html">Create an account</a>
      </p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span><span class="brand-line">Road2Role</span> · Learn, build, get hired.</span>
      <span><a href="/api/docs">API reference</a></span>
    </div>
  </footer>

  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
