<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account - Road2Role</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="/index.html" aria-label="Road2Role home">
        <svg class="brand-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 7 3 14.5 20 22l17-7.5L20 7Z" fill="currentColor"/><path d="M10 19v7c0 2.6 4.5 5 10 5s10-2.4 10-5v-7l-10 4.4L10 19Z" fill="currentColor" opacity=".75"/><path d="M36 15.5V26" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span class="brand-text">Road2Role</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a class="nav-link" href="/index.html">Home</a>
        <a class="nav-link" href="/index.html#roadmaps">Roadmaps</a>
        <a class="nav-link" href="/login.html">Sign in</a>
        <span data-auth-area></span>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <form class="form-card" data-form novalidate>
      <h1>Create your account</h1>
      <div class="alert alert-error" data-form-error hidden role="alert"></div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="3-30 chars: letters, numbers, _ or -" required autofocus />
        <p class="field-error" data-error-for="username"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        <p class="field-error" data-error-for="email"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               placeholder="At least 8 chars, a letter and a number" required
               aria-describedby="password-hint" />
        <p class="hint" id="password-hint">Minimum 8 characters, including a letter and a number.</p>
        <p class="field-error" data-error-for="password"></p>
      </div>

      <button class="btn btn-primary btn-block" type="submit" data-submit>Create account</button>

      <p class="form-footer">
        Already registered? <a href="/login.html">Sign in</a>
      </p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span><span class="brand-line">Road2Role</span> · Learn, build, get hired.</span>
      <span><a href="/api/docs">API reference</a></span>
    </div>
  </footer>

  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
