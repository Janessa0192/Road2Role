<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account - Road2Role</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
  <script src="/js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="r2r-header" data-site-header></header>

  <main id="main" class="container">
    <form class="form-card" data-form novalidate>
      <h1>Create your account</h1>
      <div class="alert alert-error" data-form-error hidden role="alert"></div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="3-30 chars: letters, numbers, _ or -" required autofocus />
        <p class="field-error" data-error-for="username"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        <p class="field-error" data-error-for="email"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               placeholder="At least 8 chars, a letter and a number" required
               aria-describedby="password-hint" />
        <p class="hint" id="password-hint">Minimum 8 characters, including a letter and a number.</p>
        <p class="field-error" data-error-for="password"></p>
      </div>

      <button class="btn btn-primary btn-block" type="submit" data-submit>Create account</button>

      <p class="form-footer">
        Already registered? <a href="/login.html">Sign in</a>
      </p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span><span class="brand-line">Road2Role</span> · Learn, build, get hired.</span>
      <span><a href="/api/docs">API reference</a></span>
    </div>
  </footer>

  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
